experiment:
  name: "medical_mcq_comparison_1_10_c"
  repetitions: 1
  max_questions: 5  # null = full test set, integer for subset (e.g. 200 for pilot)
  random_seed: 42
  temperature: 0.3
  timeout_per_query: 120
  record_failures: true

models:
  - name: "gpt-oss-20b"
    ollama_id: "gpt-oss:20b"
    category: "large_general"
  - name: "gemma3-4b"
    ollama_id: "gemma3:4b"
    category: "small_general"
  - name: "medgemma-4b"
    ollama_id: "edwardlo12/medgemma-4b-it-q4_k_m:latest"
    category: "small_domain"

rag:
  top_k: 5
  chunk_size: 512
  chunk_overlap: 50
  embedding_model: "nomic-embed-text"
  collection_name: "medqa_textbooks"

storage:
  results_dir: "results"
