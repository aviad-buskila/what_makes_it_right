experiment:
  name: "medical_mcq_comparison_100q_3r_new"
  repetitions: 3
  max_questions: 100  # null = full test set, integer for subset (e.g. 200 for pilot)
  random_seed: 42
  temperature: 0.2
  timeout_per_query: 30
  answer_retry_attempts: 2
  record_failures: true
  domain: "medical"

dataset:
  source: "medqa"
  split: "test"

models:
  - name: "gpt-oss-20b"
    ollama_id: "gpt-oss:20b"
    category: "large_general"
  - name: "gemma3-4b"
    ollama_id: "gemma3:4b"
    category: "small_general"
  - name: "medgemma-4b"
    ollama_id: "edwardlo12/medgemma-4b-it-q4_k_m:latest"
    category: "small_domain"

rag:
  top_k: 5
  chunk_size: 512
  chunk_overlap: 50
  embedding_model: "nomic-embed-text"
  collection_name: "medqa_textbooks"
  max_distance: 0.25  # cosine distance cutoff — chunks above this are discarded
  retrieval_mode: "balanced"  # fast | balanced | best
  dense_multiplier: 4
  lexical_multiplier: 4
  rerank_alpha: 0.6
  min_lexical_overlap: 0.01
  corpus_source: "medqa"
  persist_dir: "data/chroma_db"

storage:
  results_dir: "results"
